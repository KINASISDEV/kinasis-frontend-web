name: Estado de despliegue Amplify

on:
  push:
    branches:
      - main
      - devel
  workflow_dispatch:

jobs:
  validar-conexion-amplify:
    name: Validar conexion de estado de Amplify
    runs-on: ubuntu-latest

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validar acceso a Amplify
        run: |
          echo "Validando acceso a Amplify..."
          aws amplify get-app --app-id "${{ vars.AMPLIFY_APP_ID }}"

  estado-prod:
    name: Estado en Prod
    runs-on: ubuntu-latest
    needs: validar-conexion-amplify
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Obtener ultimo job de main
        shell: bash
        run: |
          JOB_ID=$(aws amplify list-jobs \
            --app-id "${{ vars.AMPLIFY_APP_ID }}" \
            --branch-name main \
            --max-items 25 \
            --query "jobSummaries[?jobId!=null] | [0].jobId" \
            --output text | tr -d '\r' | xargs)

          echo "Ultimo job en PROD: [$JOB_ID]"

          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "None" ]; then
            echo "No se encontro un job valido para la rama main"
            exit 1
          fi

          printf 'JOB_ID=%s\n' "$JOB_ID" >> "$GITHUB_ENV"

      - name: Consultar estado de PROD
        run: |
          STATUS=$(aws amplify get-job \
            --app-id "${{ vars.AMPLIFY_APP_ID }}" \
            --branch-name main \
            --job-id "$JOB_ID" \
            --query 'job.summary.status' \
            --output text)

          echo "Estado actual PROD: $STATUS"

          if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
            echo "El despliegue en PROD fallo"
            exit 1
          fi

  estado-devel:
    name: Estado en Devel
    runs-on: ubuntu-latest
    needs: validar-conexion-amplify
    if: ${{ github.ref == 'refs/heads/devel' }}

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Obtener ultimo job de devel
        shell: bash
        run: |
          JOB_ID=$(aws amplify list-jobs \
            --app-id "${{ vars.AMPLIFY_APP_ID }}" \
            --branch-name devel \
            --max-items 25 \
            --query "jobSummaries[?jobId!=null] | [0].jobId" \
            --output text | tr -d '\r' | xargs)

          echo "Ultimo job en DEVEL: [$JOB_ID]"

          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "None" ]; then
            echo "No se encontro un job valido para la rama devel"
            exit 1
          fi

          printf 'JOB_ID=%s\n' "$JOB_ID" >> "$GITHUB_ENV"

      - name: Consultar estado de DEVEL
        run: |
          STATUS=$(aws amplify get-job \
            --app-id "${{ vars.AMPLIFY_APP_ID }}" \
            --branch-name devel \
            --job-id "$JOB_ID" \
            --query 'job.summary.status' \
            --output text)

          echo "Estado actual DEVEL: $STATUS"

          if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
            echo "El despliegue en DEVEL fallo"
            exit 1
          fi